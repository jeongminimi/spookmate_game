<title>스푸크메이트 발열 측정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 측정 도구. 숫자가 주인공이라 큰 수치 → 그래프 → 설정 → 설명 순으로 쌓는다. */
:root{--bg:#121016;--panel:#1d1a24;--line:#352f40;--fg:#f2eff7;--dim:#9a92ab;
  --good:#5fe0a0;--warn:#ffc83d;--bad:#ff5a4a;--accent:#7bb8ff;
  --d:'Black Han Sans','Apple SD Gothic Neo',sans-serif;--b:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--b);word-break:keep-all;
  padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto}
h1{font:28px/1.2 var(--d);margin:0 0 2px}
.lead{color:var(--dim);font-size:13.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.big div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.big b{display:block;font:40px/1 var(--d);font-variant-numeric:tabular-nums;color:var(--c,var(--fg))}
.big span{font-size:11.5px;color:var(--dim)}
#view{width:100%;aspect-ratio:4/3;display:block;border-radius:12px;background:#0b0910}
#graph{width:100%;height:92px;display:block;border-radius:10px;background:#15121b;margin-top:10px}
.glab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1;min-width:84px;background:#2a2533;border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:9px;font:700 13px var(--b);cursor:pointer}
.row button.on{background:var(--accent);border-color:var(--accent);color:#0c1a2b}
label.sl{display:block;font-size:12.5px;color:var(--dim);margin-top:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:22px/1 var(--d);cursor:pointer;
  background:var(--fg);color:#121016;margin-top:12px}
.btn.run{background:var(--bad);color:#fff}
.verdict{display:none;margin-top:12px;padding:13px;border-radius:12px;background:#15121b;border-left:4px solid var(--c)}
.verdict.on{display:block}
.verdict h3{margin:0 0 6px;font:19px/1.2 var(--d);color:var(--c)}
.verdict p{margin:0 0 6px;font-size:13.5px}
.verdict table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.verdict td{padding:4px 0;border-bottom:1px solid var(--line)}
.verdict td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
h2{font:19px/1.3 var(--d);margin:22px 0 8px}
ol,ul{margin:0;padding-left:20px;font-size:13.5px;color:#cfc8dc}
li{margin-bottom:7px}
code{background:#2a2533;padding:1px 5px;border-radius:4px;font-size:12.5px}
.note{font-size:12.5px;color:var(--dim);margin-top:8px}
</style>
